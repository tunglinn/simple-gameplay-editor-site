<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GamePointLa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="apple-touch-icon" href="img/icon.png">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GamePointLa">
  <meta property="og:image" content="img/icon.png">
  <meta property="og:title" content="GamePointLa">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <script src="app/export-utils.js?v=2"></script>
  <link rel="stylesheet" href="app/app.css">
</head>
<body>

<!-- ══════ MAIN VIEW ══════ -->
<div id="main-view">

  <div id="header">
    <div class="logo">
      <img src="img/icon.png" alt="GamePointLa">
    </div>

    <div class="team-wrap">
      <input class="team-input" id="inp-home" type="text" placeholder="Home Team" maxlength="20" autocomplete="off">
      <div class="team-color-bar"></div>
    </div>

    <span class="vs">VS</span>

    <div class="team-wrap away">
      <input class="team-input away" id="inp-away" type="text" placeholder="Away Team" maxlength="20" autocomplete="off">
      <div class="team-color-bar"></div>
    </div>

    <button class="header-btn" onclick="triggerImport()" title="Import Markers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <button class="header-btn" onclick="openResetModal()" title="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  </div>

  <div id="video-area">
    <video id="main-video" playsinline preload="metadata"></video>
    <div id="placeholder">
      <div class="ph-ring">📂</div>
      <p>Open a Video</p>
      <small>Tap to browse your device</small>
    </div>
  </div>

  <nav id="bottom-nav">
    <button class="nav-btn" id="nav-open" onclick="triggerOpen()">
      <!-- folder -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open
    </button>
    <button class="nav-btn" id="nav-editor" onclick="openEditor()">
      <!-- play -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
      Editor
    </button>
    <button class="nav-btn" id="nav-review" onclick="openReview()">
      <!-- list -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Review
    </button>
    <button class="nav-btn" id="nav-export" onclick="openExport()">
      <!-- download -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
  </nav>
</div>

<input type="file" id="file-input" accept="video/*">
<input type="file" id="import-input" accept=".json,application/json">

<!-- ══════ EDITOR VIEW ══════ -->
<div id="editor-view">
  <video id="editor-video" playsinline preload="none"></video>

  <!-- Top bar -->
  <div id="ed-top">
    <div class="ed-top-side" id="ed-top-left">
      <button class="gl-btn" onclick="closeEditor()" title="Exit (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div id="score-wrap">
      <div id="score-teams">HOME vs AWAY</div>
      <div id="score-nums"><span class="sh" id="sc-home">0</span><span class="sep">:</span><span class="sa" id="sc-away">0</span></div>
    </div>

    <div class="ed-top-side" id="ed-top-right">
      <div id="rec-bar"></div>
      <button class="gl-btn" id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="gl-btn" id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
    </div>
  </div>

  <!-- Flex spacer -->
  <div id="ed-spacer"></div>

  <!-- Progress bar -->
  <div id="progress-wrap">
    <input type="range" id="vid-progress" min="0" max="100" value="0" step="0.05">
  </div>

  <!-- Controls -->
  <div id="ed-controls">
    <!-- D-pad -->
    <div id="dpad">
      <button class="dp" id="dp-prev" onclick="prevMark()" title="Previous Mark" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="6" y1="6" x2="6" y2="18"/><polyline points="13 7 7 12 13 17"/></svg>
      </button>
      <button class="dp" id="dp-up" onclick="dUp()" title="Toggle Highlight (U)">⭐</button>
      <button class="dp" id="dp-next" onclick="nextMark()" title="Next Mark" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="11 7 17 12 11 17"/><line x1="18" y1="6" x2="18" y2="18"/></svg>
      </button>

      <button class="dp" onclick="dLeft()" title="← 5s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
      <button class="dp center" id="dp-play" onclick="togglePlay()" title="Play/Pause (Space)">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="dp" onclick="dRight()" title="→ 5s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>

      <div class="dp dp-empty"></div>
      <button class="dp" onclick="dDown()" title="Marks List (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <div class="dp dp-empty"></div>
    </div>

    <!-- Action pad -->
    <div id="action-pad">
      <button class="act" id="btn-serve" onclick="pressServe()" title="Serve (S)">SERVE</button>
      <button class="act" id="btn-home"  onclick="pressPoint('home_point')" disabled title="Home Point (H)">HOME</button>
      <button class="act" id="btn-nopt"  onclick="pressPoint('no_point')"   disabled title="No Point (N)">NO PT</button>
      <button class="act" id="btn-away"  onclick="pressPoint('away_point')"  disabled title="Away Point (A)">AWAY</button>
    </div>
  </div>
</div>

<!-- ══════ MARKS MODAL ══════ -->
<div id="marks-modal">
  <div class="modal-backdrop" onclick="closeMarks()"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <span class="modal-title">Marks</span>
      <button class="modal-x" onclick="closeMarks()">✕</button>
    </div>
    <div class="marks-scroll" id="marks-scroll"></div>
  </div>
</div>

<!-- ══════ REVIEW PANEL ══════ -->
<div class="panel" id="review-panel">
  <div class="panel-head">
    <span class="panel-title">Review</span>
    <button class="panel-x" onclick="closePanel('review-panel')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body" id="review-body"></div>
</div>

<!-- ══════ EXPORT PANEL ══════ -->
<div class="panel" id="export-panel">
  <div class="panel-head">
    <span class="panel-title">Export</span>
    <button class="panel-x" onclick="closePanel('export-panel')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body" id="export-body"></div>
</div>

<!-- Import Confirm Modal -->
<div id="import-modal">
  <div class="reset-backdrop" onclick="closeImportModal()"></div>
  <div class="reset-card">
    <div class="reset-icon" style="background:#E8F0FE">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="reset-title">Replace Markers?</div>
    <div class="reset-msg">
      <strong id="import-new-count"></strong> markers from <em id="import-filename" style="word-break:break-all"></em> will replace your <strong id="import-existing-count"></strong> existing markers. Team names will also be updated.
    </div>
    <div class="reset-btns">
      <button class="reset-btn cancel" onclick="closeImportModal()">Cancel</button>
      <button class="reset-btn confirm" style="background:var(--home)" onclick="confirmImport()">Import</button>
    </div>
  </div>
</div>

<!-- Reset Confirm Modal -->
<div id="reset-modal">
  <div class="reset-backdrop" onclick="closeResetModal()"></div>
  <div class="reset-card">
    <div class="reset-icon">
      <svg viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </div>
    <div class="reset-title">Reset Everything?</div>
    <div class="reset-msg">This will clear the loaded video, all markers, and team names. This cannot be undone.</div>
    <div class="reset-btns">
      <button class="reset-btn cancel" onclick="closeResetModal()">Cancel</button>
      <button class="reset-btn confirm" onclick="doReset()">Reset</button>
    </div>
  </div>
</div>

<!-- Snackbar -->
<div id="snack"></div>

<script src="app/export-engine.js"></script>
<script src="app/app.js"></script>
</body>
</html>
